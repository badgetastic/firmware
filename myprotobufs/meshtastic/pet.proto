syntax = "proto3";

import "nanopb.proto";

// -----------------------------------------------------------------------------
// Common types
// -----------------------------------------------------------------------------

enum PetMessageType {
    PET_MESSAGE_TYPE_UNKNOWN        = 0;
    PET_MESSAGE_TYPE_ANNOUNCEMENT   = 1;
    PET_MESSAGE_TYPE_ACTION         = 2;
    PET_MESSAGE_TYPE_STATUS         = 3;
    PET_MESSAGE_TYPE_TIME_SIGNAL    = 4;
    PET_MESSAGE_TYPE_RECORD         = 5; // not normally enveloped, but reserved
}


// -----------------------------------------------------------------------------
// PetFragment
// -----------------------------------------------------------------------------
// Mandatory transport wrapper for all fragmented PetEnvelope messages.
// Used when a PetEnvelope exceeds the mesh MTU and must be split across
// multiple MeshPacket payloads.
//
// Fields:
// - magic: constant 0x50455446 ("PETF") identifying this as a PetFragment
// - msg_id: deterministic identifier for the full message (e.g., hash of payload)
// - fragment_index: zero-based index of this fragment
// - fragment_count: total number of fragments in the message
// - data: raw slice of the serialized PetEnvelope payload
//
// Notes:
// - All fragments for a given msg_id must be received before reassembly.
// - Fragments may arrive out of order; receivers must buffer and reorder.
// - Once all fragments are collected, concatenate data[] in index order and
//   decode the resulting PetEnvelope.
// -----------------------------------------------------------------------------

message PetFragment {
  uint32 magic = 1;          // Always 0x50455446 ("PETF")
  uint32 msg_id = 2;
  uint32 fragment_index = 3;
  uint32 fragment_count = 4;
  bytes data = 5 [(nanopb).max_size = 150];
}

// -----------------------------------------------------------------------------
// PetEnvelope
// -----------------------------------------------------------------------------
// Mandatory wrapper for all signed, public messages.
// - payload: serialized inner message (PetAnnouncement, PetAction, PetStatus, PetTimeSignal)
// - signature: raw r||s (64 bytes) over payload
// - public_key: optional 65-byte uncompressed P-256 public key of signer
//   * For pet-signed messages: pet public key
//   * For server-signed messages: may be omitted if server key is known out-of-band
// -----------------------------------------------------------------------------

message PetEnvelope {
    uint32 version = 1;

    PetMessageType message_type = 2;

    bytes payload = 3 [(nanopb).max_size = 1024];   // adjust as needed

    bytes signature = 4 [
        (nanopb).max_size = 64
    ]; // r||s, 32 bytes each

    bytes public_key = 5 [
        (nanopb).max_size = 65
    ]; // optional signer public key (uncompressed P-256)
}

// -----------------------------------------------------------------------------
// PetAnnouncement
// -----------------------------------------------------------------------------
// Public, pet-signed.
// - Contains the pet's public key and the owner's device public key.
// - Signed with petPrivateKey, via PetEnvelope.
// -----------------------------------------------------------------------------

message PetAnnouncement {
    uint32 version = 1;

    bytes pet_public_key = 2 [
        (nanopb).max_size = 65
    ]; // uncompressed P-256

        bytes owner_public_key = 3 [
        (nanopb).max_size = 65
    ]; // meshtastic node pubkey -> 32b

    uint32 node_id = 4; // uncompressed P-256
}

// -----------------------------------------------------------------------------
// PetStatus
// -----------------------------------------------------------------------------
// Public, server-signed.
// - Contains the PetAnnouncement, current pet name, and 0–255 "stat" fields.
// - Signed with petServerPrivateKey, via PetEnvelope.
// -----------------------------------------------------------------------------

message PetStatus {
    uint32 version = 1;

    PetAnnouncement pet_announcement = 2;

    bytes server_sig = 3 [
        (nanopb).max_size = 64
    ]; // r||s, 32 bytes each

    string pet_name = 4 [
        (nanopb).max_size = 32
    ];

    // All expected to be 0–255; stored as 8-bit ints via nanopb.
    uint32 sp = 5  [(nanopb).int_size = IS_8];
    uint32 re = 6  [(nanopb).int_size = IS_8];
    uint32 ha = 7  [(nanopb).int_size = IS_8];
    uint32 vg = 8  [(nanopb).int_size = IS_8];
    uint32 sa = 9  [(nanopb).int_size = IS_8];
    uint32 en = 10 [(nanopb).int_size = IS_8];
    uint32 jy = 11 [(nanopb).int_size = IS_8];
    uint32 ey = 12 [(nanopb).int_size = IS_8];
    uint32 sc = 13 [(nanopb).int_size = IS_8];

}

// -----------------------------------------------------------------------------
// PetTimeSignal
// -----------------------------------------------------------------------------
// Public, server-signed.
// - Contains current unix_time_s.
// - Signed with petServerPrivateKey, via PetEnvelope.
// -----------------------------------------------------------------------------

message PetTimeSignal {
    uint32 version = 1;

    uint64 unix_time_s = 2;
}

// -----------------------------------------------------------------------------
// PetVerb
// -----------------------------------------------------------------------------
// Defines all possible actions a pet can perform.
// Egg actions apply when SP is 0–4.
// Pet actions apply when SP is 5–9.
// NAME is universal.
// -----------------------------------------------------------------------------

enum PetVerb {
    // Universal
    NAME = 0;

    // Egg mode (SP 0–4)
    EGG_SING = 1;
    EGG_HUG  = 2;
    EGG_ROCK = 3;

    // Pet mode (SP 5–9)
    FEED  = 10;
    PLAY  = 11;
    CLEAN = 12;   // only valid when has_poop == 1
    SING  = 13;   // puts pet to sleep
    BATTLE = 14;  // optional other_pet used
}



// -----------------------------------------------------------------------------
// PetAction
// -----------------------------------------------------------------------------
// Public, pet-signed.
// - Embeds last seen PetTimeSignal and PetStatus.
// - Contains an action verb and optional extra payload.
// - Nonce prevents replay.
// - Optional other_pet for social actions (battle, trade, etc.).
// - Signed with petPrivateKey via PetEnvelope.
// -----------------------------------------------------------------------------

message PetAction {
    uint32 version = 1;

    PetTimeSignal time_signal = 2;

    PetStatus pet_status = 3;

    // The action verb (enum PetVerb)
    uint32 verb = 4;

    // Optional extra payload (e.g., name string, battle metadata)
    bytes extra = 5 [(nanopb).max_size = 64];

    // Nonce to help prevent replay / duplication.
    uint64 nonce = 6;

    // Optional other party in the action.
    PetAnnouncement other_pet = 7;
}


// -----------------------------------------------------------------------------
// PetRecord
// -----------------------------------------------------------------------------
// Private, local-only.
// - Not wrapped in PetEnvelope.
// - Stored in device preferences.
// - Contains PetStatus (which includes PetAnnouncement and pet_public_key)
//   and the petPrivateKey.
// -----------------------------------------------------------------------------

message PetRecord {
    uint32 version = 1;

    PetStatus pet_status = 2;

    bytes private_key = 3 [
        (nanopb).max_size = 32
    ]; // raw 32-byte P-256 private key
}
