name: Build StackerCon 7 Firmware

on:
  push:
    branches:
      - STAckerCon7_Release
      - STAckerCon7_Stable
      - PetModule
  pull_request:
    branches:
      - STAckerCon7_Release
      - STAckerCon7_Stable
      - PetModule

permissions: read-all

jobs:
  build:
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ github.sha }}
      platform: esp32s3
      pio_env: badgetastic
